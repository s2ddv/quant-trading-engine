[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-research-engine"
version = "0.1.0"
description = "Point-in-time contracts for synthetic quantitative trading research"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
